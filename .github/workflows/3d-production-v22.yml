name: Studio Empire Production Lab v0.22
on:
  push:
    branches: [feature/3d-engine-foundation]
  workflow_dispatch:
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate new engine and navigation scripts
        run: |
          node --check game3d/production-v22.js
          node --check game3d/production-ui-v22.js
          node --check game3d/navigation-v20.js
          node --check game3d/simulation-v21.js
      - name: Test production/economy/save compatibility
        run: |
          node --test tests/career.test.mjs
          node tests/industry-v18.test.mjs
          node tests/production-v22.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start test server
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/studio-server.log 2>&1 &
          sleep 2
      - name: Verify real mobile + desktop Production Lab and 3D scene
        run: python tests/production-v22-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-empire-v22-real-browser
          path: tests/v22-proof/
          if-no-files-found: ignore
