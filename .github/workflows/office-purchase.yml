name: Studio Empire paid office progression
on:
  push:
    branches: [feature/3d-engine-foundation]
  workflow_dispatch:
jobs:
  purchase-and-visual-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test office economics and save integrity
        run: node game3d/tests/office-economy.test.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install actual browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Serve the branch
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/studio-serve.log 2>&1 &
          sleep 2
      - name: Verify Babylon.js and actual locked/owned office screenshots
        run: python game3d/tests/office-purchase-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-office-purchase-real-browser-screenshots
          path: game3d/tests/office-proof/
          if-no-files-found: ignore
