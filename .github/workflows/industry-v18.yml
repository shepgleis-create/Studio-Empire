name: Studio Empire v0.18 Industry Regression
on:
  push:
    branches: [feature/3d-engine-foundation]
  workflow_dispatch:
jobs:
  verify-industry:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Source validity and saved-economy regressions
        run: |
          node --check game3d/industry-v18.js
          node --check game3d/industry-ui-v18.js
          node --check game3d/world-polish-v18.js
          node tests/industry-v18.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Serve game
        run: |
          python -m http.server 8765 --bind 127.0.0.1 > /tmp/studio-v18-http.log 2>&1 &
          sleep 2
      - name: Verify real Babylon.js 3D and industry controls
        run: python tests/3d-industry-v18-browser.py
      - name: Upload real browser captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-empire-v18-real-3d
          path: game3d/tests/industry-v18-proof/
          if-no-files-found: ignore
