name: Studio Empire v0.20 Navigation and Responsive WebGL
on:
  push:
    branches: [feature/3d-engine-foundation]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript and asset wiring
        run: |
          node --check game3d/navigation-v20.js
          node --check game3d/main-menu-v19.js
          node --input-type=module -e "import fs from 'node:fs'; let h=fs.readFileSync('game3d/index.html','utf8'); if(!h.includes('interface-v20.css')||!h.includes('navigation-v20.js')||h.indexOf('navigation-v20.js')<h.indexOf('industry-ui-v18.js'))process.exit(1);"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Serve existing repository
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/studio-v20.log 2>&1 &
          sleep 2
      - name: Verify real 3D and navigation
        run: python tests/ui-v20-browser.py
      - name: Save actual WebGL screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-empire-v20-ui-proof
          path: verified/ui-v20/
          if-no-files-found: ignore
